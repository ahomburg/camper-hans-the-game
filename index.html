<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Camper Hans – Testfahrt</title>
  <link rel="icon" type="image/png" href="images/logos/logo-hans-emblem.png">
  <!-- Camper-Hans-CI: Variablen + ch-Komponenten (Source of Truth: camper-hans-ci) -->
  <link rel="stylesheet" href="css/camper-hans.css">
  <style>
    /* ---------- Spiel-Grundgerüst (CI: Creme-Papier statt Dunkelgrau) ---------- */
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--ch-cream); color: var(--ch-night);
      touch-action: none; overscroll-behavior: none;
      font-family: var(--ch-font-body);
    }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* Spielfläche als Sticker im Heft (CI-Regel für Canvas) */
    #app canvas {
      box-sizing: border-box;
      border: 3px solid var(--ch-night);
      border-radius: var(--ch-radius-lg);
      box-shadow: var(--ch-shadow-soft);
    }

    /* ---------- HUD (oben, Sticker-Panels auf dem Papier) ---------- */
    #hud {
      position: fixed; top: 12px; left: 14px; right: 14px; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; pointer-events: none;
    }
    #speedo {
      flex: none; width: 118px; height: 118px;
      background: var(--ch-paper);
      border: 3px solid var(--ch-night);
      border-radius: 50%;
      box-shadow: var(--ch-shadow-pop);
      padding: 5px;
    }
    #speedo svg { width: 100%; height: 100%; display: block; }
    .speedo-num { font-family: var(--ch-font-display); font-weight: 700; font-size: 17px; fill: var(--ch-night); }
    .speedo-unit { font-size: 8.5px; font-weight: 700; letter-spacing: .06em; fill: var(--ch-night-soft); }
    .speedo-tick { font-size: 8.5px; font-weight: 700; fill: var(--ch-night-soft); }
    #side { flex-direction: column; align-items: flex-end; gap: 2px; padding: 10px 16px; }
    #time, #highscore, #coins {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 16px;
      font-variant-numeric: tabular-nums; line-height: 1.3;
    }
    #time { color: var(--ch-night); }
    #highscore { color: var(--ch-sun-dark); }
    #coins { color: var(--ch-wood-dark); }
    #coins.bump { animation: coin-bump .45s var(--ch-spring); }
    @keyframes coin-bump { 30% { transform: scale(1.35) rotate(-4deg); } }

    /* ---------- Coin-Popups (+/- Buchungen schweben unter der Kasse auf) ---------- */
    #coin-pop {
      position: fixed; top: 96px; right: 26px; z-index: 7;
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      pointer-events: none;
    }
    .coin-delta {
      font-family: var(--ch-font-hand); font-weight: 700; font-size: 1.45rem; line-height: 1.1;
      animation: coin-float 1.5s ease forwards;
    }
    .coin-delta.plus { color: var(--ch-forest-dark); }
    .coin-delta.minus { color: var(--ch-campfire-dark); }
    @keyframes coin-float {
      0% { opacity: 0; transform: translateY(8px) rotate(-2deg); }
      14% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-36px) rotate(2deg); }
    }

    /* ---------- Crash: Banner (Handschrift-Zettel) + Rötungs-Blitz uebers Bild ---------- */
    #crash {
      position: fixed; top: 24%; left: 50%; z-index: 9;
      transform: translate(-50%, -50%) scale(.6) rotate(-3deg);
      font-family: var(--ch-font-hand); font-weight: 700; font-size: 2.1rem; line-height: 1.2;
      color: var(--ch-campfire-dark); background: var(--ch-fire-soft);
      border: 3px solid var(--ch-night); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-pop);
      padding: 8px 24px; white-space: nowrap; max-width: 88vw;
      opacity: 0; pointer-events: none;
      transition: opacity .12s ease, transform .12s var(--ch-spring);
    }
    #crash.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    #crashflash {
      position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(198, 69, 31, 0) 42%, rgba(198, 69, 31, .5) 100%);
    }
    #crashflash.show { opacity: var(--flash, .5); transition: none; }
    #crashflash { transition: opacity .5s ease-out; }

    /* ---------- Kapitel-Anzeige (freier Text + Fortschrittsbalken, ohne Rahmen) ---------- */
    #chapter {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
      width: min(360px, 86vw);
    }
    /* Auf schmalen Bildschirmen unter Tacho/Zeit-Panels, sonst Ueberlappung */
    @media (max-width: 720px) { #chapter { top: 138px; } }
    .chapter { text-align: center; padding: 2px; }
    .chapter .c-title {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 19px;
      color: var(--ch-campfire-dark);
    }
    .chapter .c-bar { margin-top: 6px; height: 15px; border-radius: var(--ch-radius-pill); background: var(--ch-sun-soft); border: 2px solid var(--ch-night); overflow: hidden; }
    .chapter .c-fill { height: 100%; width: 0; border-radius: var(--ch-radius-pill);
      background: repeating-linear-gradient(45deg, var(--ch-sun) 0 10px, var(--ch-sun-dark) 10px 20px);
      transition: width .25s; }
    .chapter.done .c-title { color: var(--ch-forest-dark); }
    .chapter.done .c-fill { background: repeating-linear-gradient(45deg, var(--ch-forest) 0 10px, var(--ch-forest-dark) 10px 20px); }

    /* ---------- Toast (Hans' handgeschriebener Merkzettel) ---------- */
    #toast {
      position: fixed; top: 32%; left: 50%; transform: translate(-50%,-50%) scale(.92) rotate(-1deg); z-index: 8;
      background: var(--ch-night); color: var(--ch-sun-soft);
      border: 2px solid var(--ch-night); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-pop);
      padding: 12px 26px; font-family: var(--ch-font-hand); font-size: 1.5rem; line-height: 1.2;
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; text-align: center; max-width: 88vw;
    }
    #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-1deg); }

    /* ---------- Hauptmenü (Creme-Papier, aufgeschlagenes Buch) ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 30; overflow-y: auto;
      background: var(--ch-cream);
      display: flex; flex-direction: column; align-items: center; gap: var(--ch-space-sm);
      padding: 36px 16px 48px;
    }
    #menu.hidden, #success.hidden, #failed.hidden { display: none; }

    /* Gespann tuckert hinter dem Menueinhalt durch (Gag auf der Creme-Wiese).
       Der Renderer liefert Fensterbreite x 150 px, der Streifen ist genauso
       proportioniert - so faehrt das Auto von ganz links bis ganz rechts,
       ohne verzerrt zu werden.
       Sandwich-Reihenfolge: Das Gespann faehrt VOR der Handschrift
       "Camper Hans" (z 1 < 2), aber HINTER "the game" und dem Emblem
       (z 3 > 2) - nur die grosse Marke wird ueberfahren. */
    #menu-ride {
      position: fixed; left: 0; width: 100vw; height: 150px; top: calc(14% + 20px);
      z-index: 2; pointer-events: none;
      object-fit: contain; object-position: center;
    }
    #menu > *:not(#menu-ride):not(.menu-emblem):not(.menu-title) { position: relative; z-index: 1; }
    #menu > .menu-emblem, #menu > .menu-title { position: relative; z-index: 3; }
    /* Emblem dichter an die Marke ran (setzt den 16-px-Flex-Gap teilweise aus) */
    #menu > .menu-brand { margin-top: -12px; }

    .menu-emblem {
      height: 72px; width: auto; border-radius: var(--ch-radius-pill);
      border: 3px solid var(--ch-night); box-shadow: var(--ch-shadow-soft); background: var(--ch-paper);
    }
    /* Emblem im Hauptmenue groesser (Ladebildschirm behaltet 72px) */
    #menu > .menu-emblem { height: 112px; }
    #menu h1 { margin: 0; }
    /* Brand in Hans' Handschrift, darunter der Spiel-Titel in der Display-Schrift */
    .menu-brand {
      font-family: var(--ch-font-hand);
      font-weight: 700;
      font-size: clamp(3rem, 9vw, 4.6rem);
      line-height: 1.05;
      color: var(--ch-campfire-dark);
      transform: rotate(-2deg);
    }
    /* '#menu > h1' noetig: die CI-Regel 'h1.ch-h1' setzt color mit
       Klasse+Element-Spezifitaet und schlaegt eine Regel mit nur .menu-title */
    #menu > .menu-title {
      font-size: clamp(1.9rem, 4.5vw, 2.9rem); margin-top: -6px;
      color: var(--ch-sky);
      /* Lora gibt es nur bis 700 - dicker geht per Kontur in der
         eigenen Farbe (wirkt wie ein Fettschnitt darueber) */
      -webkit-text-stroke: 0.6px currentColor;
    }

    #menu-vehicles { display: flex; gap: 10px; width: min(460px, 92vw); margin-top: var(--ch-space-3xs); }
    /* Fahrzeugwahl: nur ein Vorschaubild, keine Erklaertexte (Feedback) */
    .veh-btn {
      flex: 1; padding: 6px; cursor: pointer;
      background: var(--ch-paper);
      border: 2px solid var(--ch-night); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-pop);
      transition: transform var(--ch-fast) var(--ch-spring), background-color var(--ch-fast) ease;
    }
    .veh-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 rgba(34,51,59,0.9); }
    .veh-btn.active { background: var(--ch-sun-soft); border-color: var(--ch-sun-dark); }
    .veh-img { display: block; width: 100%; height: 110px; object-fit: contain; border-radius: calc(var(--ch-radius-md) - 3px); }

    /* Kapitelauswahl als aufgeschlagenes Buch: Holzeinband (Buchdeckel) mit
       Papierspitzen, zwei Seiten nebeneinander, Falz-Schatten in der Mitte.
       Jedes Kapitel ist eine Seite (class "book-page", siehe renderMenu). */
    #menu-book {
      position: relative;
      width: min(720px, 94vw);
      margin-top: var(--ch-space-sm);
      padding: 14px 14px 18px;
      background: linear-gradient(150deg, var(--ch-wood) 0%, var(--ch-wood-dark) 100%);
      border: 3px solid var(--ch-night);
      border-radius: 8px 14px 14px 8px;
      box-shadow: var(--ch-shadow-pop), inset 0 2px 0 rgba(255, 253, 245, 0.25);
    }
    /* Buchtitel-Prägung auf dem Einband */
    .book-heading {
      font-family: var(--ch-font-display);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-align: center;
      color: var(--ch-sun);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      margin: 0 0 10px;
    }
    /* Seitenblock: Papier, an den Außenkanten schauen unten/rechts die
       Blattkanten aus dem Einband (pseudo-Elemente am #menu-book). */
    .book-pages {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      background: var(--ch-paper);
      border-radius: 3px 10px 10px 3px;
      box-shadow: inset 0 -10px 22px -14px rgba(110, 67, 31, 0.4);
    }
    #menu-book::after { /* gestapelte Blattkanten unten im Einband */
      content: '';
      position: absolute;
      left: 17px; right: 20px; bottom: 5px; height: 11px;
      background: repeating-linear-gradient(180deg, #FFFDF5 0 1.5px, #E9D9B6 1.5px 3px);
      border-radius: 0 0 6px 2px;
    }
    #menu-book::before { /* Blattkanten an der rechten Einband-Kante */
      content: '';
      position: absolute;
      top: 17px; bottom: 20px; right: 4px; width: 6px;
      background: repeating-linear-gradient(90deg, #FFFDF5 0 1.5px, #E9D9B6 1.5px 3px);
      border-radius: 0 3px 3px 0;
    }
    /* Falz: weicher Buchrücken-Schatten zwischen den beiden Seiten */
    .book-pages::before {
      content: '';
      position: absolute; left: 50%; top: 0; bottom: 0;
      width: 52px; transform: translateX(-50%);
      background: linear-gradient(90deg,
        rgba(34, 51, 59, 0) 0%,
        rgba(34, 51, 59, 0.13) 42%,
        rgba(34, 51, 59, 0.20) 50%,
        rgba(34, 51, 59, 0.13) 58%,
        rgba(34, 51, 59, 0) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .book-page {
      position: relative;
      min-height: 210px;
      padding: 24px 24px 18px;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    /* Papier krümmt sich zum Falz: linke Seite wird nach rechts, rechte nach
       links hin etwas dunkler - n-th-child statt :first-child wirkt auch,
       wenn spaeter weitere Kapitel dazu kommen (2er-Raster). */
    .book-page:nth-child(odd) {
      background: linear-gradient(90deg, var(--ch-paper) 58%, #F3E7CD 100%);
    }
    .book-page:nth-child(even) {
      background: linear-gradient(270deg, var(--ch-paper) 58%, #F3E7CD 100%);
    }
    /* Lesebändchen: Zustand des Kapitels als Textmarke uber der Seite */
    .book-ribbon {
      position: absolute;
      top: -13px; right: 14px; z-index: 3;
      padding: 4px 12px 12px;
      font-family: var(--ch-font-display); font-weight: 700;
      font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
      background: var(--ch-sun); color: var(--ch-night);
      border: 2px solid var(--ch-night); border-top: none;
      border-radius: 0 0 5px 5px;
      box-shadow: 2px 2px 0 rgba(34, 51, 59, 0.35);
      transform: rotate(2.5deg);
    }
    .book-ribbon::after { /* Kerbe im Bändchen unten */
      content: '';
      position: absolute;
      left: -2px; right: -2px; bottom: -13px; height: 14px;
      background: inherit;
      border: 2px solid var(--ch-night); border-top: none;
      clip-path: polygon(0 0, 100% 0, 50% 100%, 0 0);
    }
    .book-ribbon.done { background: var(--ch-forest); color: #fff; }
    .bp-kicker {
      font-family: var(--ch-font-hand);
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.1;
      color: var(--ch-campfire-dark);
      transform: rotate(-1deg);
    }
    .bp-title {
      font-family: var(--ch-font-display);
      font-weight: 700;
      font-size: clamp(1.2rem, 2.8vw, 1.45rem);
      line-height: 1.2;
      color: var(--ch-night);
      margin: 3px 0 2px;
    }
    /* Zierlinie mit Fleuron (✦) zwischen Titel und Beschreibung */
    .bp-rule {
      display: flex; align-items: center; gap: 8px;
      margin: 8px 0 10px;
      font-size: 11px; line-height: 1;
      color: var(--ch-wood-dark);
    }
    .bp-rule::before, .bp-rule::after {
      content: '';
      height: 2px; flex: 1;
      background: var(--ch-wood);
      border-radius: var(--ch-radius-pill);
      opacity: 0.75;
    }
    .bp-desc {
      flex: 1;
      font-family: var(--ch-font-display);
      font-weight: 500;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--ch-night-soft);
    }
    .bp-start { margin-top: 14px; align-self: flex-start; }
    /* Schmale Bildschirme: Buch wird hoch geklappt, Falz-Schatten weg, dafuer
       Blatt-Trennlinie zwischen den uebereinander liegenden Seiten */
    @media (max-width: 720px) {
      .book-pages { grid-template-columns: 1fr; }
      .book-pages::before { display: none; }
      .book-page + .book-page { border-top: 2px solid rgba(34, 51, 59, 0.14); }
      .book-page { min-height: 0; padding: 20px 20px 16px; }
    }

    #menu-highscore {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 15px;
      color: var(--ch-wood-dark); font-variant-numeric: tabular-nums;
    }
    #menu-coins {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 15px;
      color: var(--ch-sun-dark); font-variant-numeric: tabular-nums;
    }
    .menu-hint { font-family: var(--ch-font-hand); font-size: 1.25rem; color: var(--ch-campfire-dark); opacity: .9; text-align: center; max-width: min(460px, 92vw); }

    /* ---------- Erfolg / Scheitern (Sticker-Karten auf Nacht-Vorhang) ---------- */
    #success, #failed {
      position: fixed; inset: 0; z-index: 26;
      display: flex; align-items: center; justify-content: center;
      background: rgba(34, 51, 59, 0.55); padding: 16px;
    }
    #success { z-index: 25; }
    #success .box, #failed .box {
      border: 3px solid var(--ch-night); border-radius: var(--ch-radius-lg);
      box-shadow: var(--ch-shadow-sticker);
      padding: 26px 34px; text-align: center; max-width: 92vw;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #success .box { background: var(--ch-forest-soft); animation: ch-bounce var(--ch-slow) var(--ch-spring); }
    #failed .box { background: var(--ch-fire-soft); animation: ch-shake var(--ch-slow) ease; }
    #success h2, #failed h2 { margin: 0 0 6px; font-size: 24px; }
    #success h2 { color: var(--ch-forest-dark); }
    #failed h2 { color: var(--ch-campfire-dark); }
    .result-hans { height: 96px; }
    #success-time, #success-highscore, .result-coins { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--ch-night); }
    #success-highscore { font-weight: 700; color: var(--ch-wood-dark); }
    .result-coins { font-weight: 700; color: var(--ch-sun-dark); }
    #fail-reason { font-size: 18px; line-height: 1.45; color: var(--ch-night); }
    #failed-coins { font-size: 18px; }
    .fail-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

    /* ---------- Ladebildschirm ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 50;
      background: var(--ch-cream); color: var(--ch-night);
      display: flex; flex-direction: column; gap: var(--ch-space-md); align-items: center; justify-content: center;
      transition: opacity .4s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .menu-emblem { animation: ch-float 3s ease-in-out infinite; }
    .spinner { width: 42px; height: 42px; border: 4px solid var(--ch-forest-soft); border-top-color: var(--ch-campfire); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadtext { font-family: var(--ch-font-display); font-weight: 600; font-size: 18px; color: var(--ch-night-soft); }

    /* ---------- Touch-Steuerung (dicke Sticker-Buttons) ---------- */
    #touch { display: none; }
    body.touch #touch { display: block; }
    .cluster { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 14px; z-index: 6; }
    .cluster.left { left: 18px; }
    .cluster.right { right: 18px; flex-direction: column; }
    .cluster button {
      width: 70px; height: 70px; border-radius: 50%;
      border: 3px solid var(--ch-night); background: var(--ch-paper); color: var(--ch-night);
      font-family: var(--ch-font-display); font-weight: 700; font-size: 12px; letter-spacing: .04em;
      box-shadow: var(--ch-shadow-pop);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .cluster.right button { width: 82px; height: 58px; border-radius: var(--ch-radius-md); }
    .cluster button.active { background: var(--ch-sun); border-color: var(--ch-sun-dark); transform: translateY(4px); box-shadow: 0 2px 0 rgba(34,51,59,0.9); }

    /* ---------- Hupe & Ansicht (Sticker-Buttons mit Tasten-Tooltip) ---------- */
    #aux {
      position: fixed; left: 18px; bottom: max(18px, env(safe-area-inset-bottom));
      display: flex; gap: 10px; z-index: 6;
    }
    /* Auf Touch-Geraeten ueber den Lenk-Buttons, damit sich nichts ueberlappt */
    body.touch #aux { flex-direction: column; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 96px); }
    .aux-btn {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font-family: var(--ch-font-display); font-weight: 700; font-size: 13px; line-height: 1;
      color: var(--ch-night); background: var(--ch-paper);
      border: 3px solid var(--ch-night); border-radius: var(--ch-radius-pill);
      padding: 10px 14px; box-shadow: var(--ch-shadow-pop);
      touch-action: none; user-select: none; -webkit-user-select: none;
      transition: transform var(--ch-fast) var(--ch-spring), background-color var(--ch-fast) ease;
    }
    .aux-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 rgba(34,51,59,0.9); }
    .aux-btn:active { background: var(--ch-sun); transform: translateY(6px); box-shadow: 0 0 0 rgba(34,51,59,0.9); }
    .aux-btn:focus-visible { outline: 3px solid var(--ch-sun); outline-offset: 2px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="ch-body">
  <div id="app"></div>

  <div id="hud">
    <div id="speedo" role="img" aria-label="Tacho">
      <svg id="speedo-svg" viewBox="0 0 120 120" aria-hidden="true">
        <g id="speedo-scale"></g>
        <g id="speedo-needle" transform="rotate(-135 60 60)">
          <polygon points="60,25 57,62 63,62" fill="var(--ch-campfire)" stroke="var(--ch-night)" stroke-width="1"></polygon>
          <circle cx="60" cy="60" r="5" fill="var(--ch-night)"></circle>
          <circle cx="60" cy="60" r="2" fill="var(--ch-cream)"></circle>
        </g>
        <text id="speedo-num" x="60" y="90" text-anchor="middle" class="speedo-num">0</text>
        <text x="60" y="101" text-anchor="middle" class="speedo-unit">km/h</text>
      </svg>
    </div>
    <div id="side" class="ch-hud">
      <div id="time">Zeit: 0.0 s</div>
      <div id="highscore">Highscore: –</div>
      <div id="coins">🪙 <span id="coins-num">0</span></div>
    </div>
  </div>

  <div id="coin-pop"></div>
  <div id="crash"></div>
  <div id="crashflash"></div>

  <div id="chapter"></div>
  <div id="toast"></div>

  <div id="menu">
    <canvas id="menu-ride" aria-hidden="true"></canvas>
    <img class="menu-emblem" src="images/logos/logo-hans-emblem.png" alt="Camper Hans Logo">
    <span class="menu-brand">Camper Hans</span>
    <h1 class="ch-h1 menu-title">DAS SPIEL</h1>
    <div id="menu-vehicles">
      <button class="veh-btn" data-veh="campervan" aria-label="Campervan"><img class="veh-img" alt="Campervan"></button>
      <button class="veh-btn" data-veh="gespann" aria-label="Grünes Auto mit Wohnwagen"><img class="veh-img" alt="Grünes Auto mit Wohnwagen"></button>
    </div>
    <!-- Kapitelauswahl: aufgeschlagenes Buch (Holzeinband, zwei Seiten) -->
    <div id="menu-book">
      <div class="book-heading">Inhaltsverzeichnis</div>
      <div id="menu-chapters" class="book-pages"></div>
    </div>
    <div id="menu-highscore">Highscore: –</div>
    <div id="menu-coins">Reisekasse: 0 🪙</div>
    <div class="menu-hint">ESC = Kapitel abbrechen</div>
  </div>

  <div id="success" class="hidden">
    <div class="box">
      <img class="ch-portrait result-hans" src="images/logos/logo-hans-portrait.png" alt="Camper Hans">
      <h2 class="ch-h2">Geschafft, du hast es geparkt!</h2>
      <div id="success-time"></div>
      <div id="success-highscore"></div>
      <div id="success-coins" class="result-coins"></div>
      <button id="btn-to-menu" class="ch-btn ch-btn-primary ch-mt-sm">Zurück zum Hauptmenü</button>
    </div>
  </div>

  <div id="failed" class="hidden">
    <div class="box">
      <img class="ch-portrait result-hans" src="images/logos/logo-hans-portrait.png" alt="Camper Hans">
      <h2 class="ch-h2">Kapitel gescheitert!</h2>
      <div id="fail-reason"></div>
      <div id="failed-coins" class="result-coins"></div>
      <div class="fail-actions">
        <button id="btn-retry" class="ch-btn ch-btn-fire">Neu starten</button>
        <button id="btn-fail-menu" class="ch-btn ch-btn-ghost">Hauptmenü</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <img class="menu-emblem" src="images/logos/logo-hans-emblem.png" alt="Camper Hans Logo">
    <div class="spinner"></div>
    <div id="loadtext">Lade Campervan …</div>
  </div>

  <div id="touch">
    <div class="cluster left">
      <button id="btn-left" aria-label="Links lenken">LINKS</button>
      <button id="btn-right" aria-label="Rechts lenken">RECHTS</button>
    </div>
    <div class="cluster right">
      <button id="btn-up" aria-label="Gas geben">GAS</button>
      <button id="btn-down" aria-label="Bremsen / Rückwärts">BREMS</button>
    </div>
  </div>

  <!-- Hupe & Ansicht: auch klickbar, Tooltip nennt die Tastenkürzel -->
  <div id="aux">
    <span class="ch-tooltip-wrap">
      <button id="btn-horn" class="aux-btn" aria-label="Hupe (Taste H)">📢 Hupe</button>
      <span class="ch-tooltip" role="tooltip">Taste H</span>
    </span>
    <span class="ch-tooltip-wrap">
      <button id="btn-view" class="aux-btn" aria-label="Ansicht wechseln (Taste C)">📷 Ansicht</button>
      <span class="ch-tooltip" role="tooltip">Taste C</span>
    </span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
