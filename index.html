<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Camper Hans – Testfahrt</title>
  <link rel="icon" type="image/png" href="images/logos/logo-hans-emblem.png">
  <!-- Camper-Hans-CI: Variablen + ch-Komponenten (Source of Truth: camper-hans-ci) -->
  <link rel="stylesheet" href="css/camper-hans.css">
  <style>
    /* ---------- Spiel-Grundgerüst (CI: Creme-Papier statt Dunkelgrau) ---------- */
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--ch-cream); color: var(--ch-night);
      touch-action: none; overscroll-behavior: none;
      font-family: var(--ch-font-body);
    }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* Spielfläche als Sticker im Heft (CI-Regel für Canvas) */
    #app canvas {
      box-sizing: border-box;
      border: 3px solid var(--ch-night);
      border-radius: var(--ch-radius-lg);
      box-shadow: var(--ch-shadow-soft);
    }

    /* ---------- HUD (oben, Sticker-Panels auf dem Papier) ---------- */
    #hud {
      position: fixed; top: 12px; left: 14px; right: 14px; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; pointer-events: none;
    }
    #speedo {
      flex: none; width: 118px; height: 118px;
      background: var(--ch-paper);
      border: 3px solid var(--ch-night);
      border-radius: 50%;
      box-shadow: var(--ch-shadow-pop);
      padding: 5px;
    }
    #speedo svg { width: 100%; height: 100%; display: block; }
    .speedo-num { font-family: var(--ch-font-display); font-weight: 700; font-size: 17px; fill: var(--ch-night); }
    .speedo-unit { font-size: 8.5px; font-weight: 700; letter-spacing: .06em; fill: var(--ch-night-soft); }
    .speedo-tick { font-size: 8.5px; font-weight: 700; fill: var(--ch-night-soft); }
    #side { flex-direction: column; align-items: flex-end; gap: 2px; padding: 10px 16px; }
    #time, #highscore {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 16px;
      font-variant-numeric: tabular-nums; line-height: 1.3;
    }
    #time { color: var(--ch-night); }
    #highscore { color: var(--ch-sun-dark); }

    /* ---------- Quest-Anzeige (Karte mit Fortschrittsbalken) ---------- */
    #quest {
      position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
      width: min(320px, 86vw);
    }
    .quest {
      background: var(--ch-paper);
      border: 2px solid var(--ch-night);
      border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-soft);
      padding: 8px 14px 10px; text-align: center;
    }
    .quest .q-title { font-family: var(--ch-font-display); font-weight: 700; font-size: 15px; color: var(--ch-campfire-dark); }
    .quest .q-bar { margin-top: 6px; height: 12px; border-radius: var(--ch-radius-pill); background: var(--ch-sun-soft); border: 2px solid var(--ch-night); overflow: hidden; }
    .quest .q-fill { height: 100%; width: 0; border-radius: var(--ch-radius-pill);
      background: repeating-linear-gradient(45deg, var(--ch-sun) 0 8px, var(--ch-sun-dark) 8px 16px);
      transition: width .25s; }
    .quest.done { background: var(--ch-forest-soft); }
    .quest.done .q-title { color: var(--ch-forest-dark); }
    .quest.done .q-fill { background: repeating-linear-gradient(45deg, var(--ch-forest) 0 8px, var(--ch-forest-dark) 8px 16px); }

    /* ---------- Toast (Hans' handgeschriebener Merkzettel) ---------- */
    #toast {
      position: fixed; top: 32%; left: 50%; transform: translate(-50%,-50%) scale(.92) rotate(-1deg); z-index: 8;
      background: var(--ch-night); color: var(--ch-sun-soft);
      border: 2px solid var(--ch-night); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-pop);
      padding: 12px 26px; font-family: var(--ch-font-hand); font-size: 1.5rem; line-height: 1.2;
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; text-align: center; max-width: 88vw;
    }
    #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-1deg); }

    /* ---------- Hauptmenü (Creme-Papier, Sticker-Karten) ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 30; overflow-y: auto;
      background: var(--ch-cream);
      display: flex; flex-direction: column; align-items: center; gap: var(--ch-space-sm);
      padding: 36px 16px 48px;
    }
    #menu.hidden, #success.hidden, #failed.hidden { display: none; }

    /* Gespann tuckert hinter dem Menueinhalt durch (Gag auf der Creme-Wiese).
       Der Renderer liefert Fensterbreite x 150 px, der Streifen ist genauso
       proportioniert - so faehrt das Auto von ganz links bis ganz rechts,
       ohne verzerrt zu werden. */
    #menu-ride {
      position: fixed; left: 0; width: 100vw; height: 150px; top: 14%;
      z-index: 0; pointer-events: none;
      object-fit: contain; object-position: center;
    }
    #menu > *:not(#menu-ride) { position: relative; z-index: 1; }

    .menu-emblem {
      height: 72px; width: auto; border-radius: var(--ch-radius-pill);
      border: 3px solid var(--ch-night); box-shadow: var(--ch-shadow-soft); background: var(--ch-paper);
    }
    #menu h1 { margin: 0; }
    /* Brand in Hans' Handschrift, darunter der Spiel-Titel in der Display-Schrift */
    .menu-brand {
      font-family: var(--ch-font-hand);
      font-weight: 700;
      font-size: clamp(3rem, 9vw, 4.6rem);
      line-height: 1.05;
      color: var(--ch-campfire-dark);
      transform: rotate(-2deg);
    }
    .menu-title { font-size: clamp(1.5rem, 3.5vw, 2.2rem); margin-top: -6px; }

    #menu-vehicles { display: flex; gap: 10px; width: min(460px, 92vw); margin-top: var(--ch-space-3xs); }
    /* Fahrzeugwahl: nur ein Vorschaubild, keine Erklaertexte (Feedback) */
    .veh-btn {
      flex: 1; padding: 6px; cursor: pointer;
      background: var(--ch-paper);
      border: 2px solid var(--ch-night); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-pop);
      transition: transform var(--ch-fast) var(--ch-spring), background-color var(--ch-fast) ease;
    }
    .veh-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 rgba(34,51,59,0.9); }
    .veh-btn.active { background: var(--ch-sun-soft); border-color: var(--ch-sun-dark); }
    .veh-img { display: block; width: 100%; height: 110px; object-fit: contain; border-radius: calc(var(--ch-radius-md) - 3px); }

    #menu-quests { display: flex; flex-direction: column; gap: 12px; width: min(460px, 92vw); margin-top: var(--ch-space-3xs); }
    .menu-quest {
      background: var(--ch-paper);
      border: 2px solid var(--ch-night); border-radius: var(--ch-radius-lg);
      box-shadow: var(--ch-shadow-soft);
      padding: 14px 16px;
    }
    .menu-quest.done { background: var(--ch-forest-soft); }
    .mq-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .mq-title { font-family: var(--ch-font-display); font-weight: 700; font-size: 16px; color: var(--ch-night); }
    .mq-desc { font-size: 12.5px; color: var(--ch-night-soft); margin-top: 4px; line-height: 1.45; }
    .mq-start { margin-top: 12px; }

    #menu-highscore {
      font-family: var(--ch-font-display); font-weight: 700; font-size: 15px;
      color: var(--ch-wood-dark); font-variant-numeric: tabular-nums;
    }
    .menu-hint { font-family: var(--ch-font-hand); font-size: 1.25rem; color: var(--ch-campfire-dark); opacity: .9; text-align: center; max-width: min(460px, 92vw); }

    /* ---------- Erfolg / Scheitern (Sticker-Karten auf Nacht-Vorhang) ---------- */
    #success, #failed {
      position: fixed; inset: 0; z-index: 26;
      display: flex; align-items: center; justify-content: center;
      background: rgba(34, 51, 59, 0.55); padding: 16px;
    }
    #success { z-index: 25; }
    #success .box, #failed .box {
      border: 3px solid var(--ch-night); border-radius: var(--ch-radius-lg);
      box-shadow: var(--ch-shadow-sticker);
      padding: 26px 34px; text-align: center; max-width: 92vw;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #success .box { background: var(--ch-forest-soft); animation: ch-bounce var(--ch-slow) var(--ch-spring); }
    #failed .box { background: var(--ch-fire-soft); animation: ch-shake var(--ch-slow) ease; }
    #success h2, #failed h2 { margin: 0 0 6px; font-size: 24px; }
    #success h2 { color: var(--ch-forest-dark); }
    #failed h2 { color: var(--ch-campfire-dark); }
    .result-hans { height: 96px; }
    #success-time, #success-highscore { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ch-night); }
    #success-highscore { font-weight: 700; color: var(--ch-wood-dark); }
    #fail-reason { font-size: 14.5px; line-height: 1.5; color: var(--ch-night); }
    .fail-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

    /* ---------- Ladebildschirm ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 50;
      background: var(--ch-cream); color: var(--ch-night);
      display: flex; flex-direction: column; gap: var(--ch-space-md); align-items: center; justify-content: center;
      transition: opacity .4s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .menu-emblem { animation: ch-float 3s ease-in-out infinite; }
    .spinner { width: 42px; height: 42px; border: 4px solid var(--ch-forest-soft); border-top-color: var(--ch-campfire); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadtext { font-family: var(--ch-font-display); font-weight: 600; font-size: 18px; color: var(--ch-night-soft); }

    /* ---------- Touch-Steuerung (dicke Sticker-Buttons) ---------- */
    #touch { display: none; }
    body.touch #touch { display: block; }
    .cluster { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 14px; z-index: 6; }
    .cluster.left { left: 18px; }
    .cluster.right { right: 18px; flex-direction: column; }
    .cluster button {
      width: 70px; height: 70px; border-radius: 50%;
      border: 3px solid var(--ch-night); background: var(--ch-paper); color: var(--ch-night);
      font-family: var(--ch-font-display); font-weight: 700; font-size: 12px; letter-spacing: .04em;
      box-shadow: var(--ch-shadow-pop);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .cluster.right button { width: 82px; height: 58px; border-radius: var(--ch-radius-md); }
    .cluster button.active { background: var(--ch-sun); border-color: var(--ch-sun-dark); transform: translateY(4px); box-shadow: 0 2px 0 rgba(34,51,59,0.9); }

    /* ---------- Hupe & Ansicht (Sticker-Buttons mit Tasten-Tooltip) ---------- */
    #aux {
      position: fixed; left: 18px; bottom: max(18px, env(safe-area-inset-bottom));
      display: flex; gap: 10px; z-index: 6;
    }
    /* Auf Touch-Geraeten ueber den Lenk-Buttons, damit sich nichts ueberlappt */
    body.touch #aux { flex-direction: column; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 96px); }
    .aux-btn {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font-family: var(--ch-font-display); font-weight: 700; font-size: 13px; line-height: 1;
      color: var(--ch-night); background: var(--ch-paper);
      border: 3px solid var(--ch-night); border-radius: var(--ch-radius-pill);
      padding: 10px 14px; box-shadow: var(--ch-shadow-pop);
      touch-action: none; user-select: none; -webkit-user-select: none;
      transition: transform var(--ch-fast) var(--ch-spring), background-color var(--ch-fast) ease;
    }
    .aux-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 rgba(34,51,59,0.9); }
    .aux-btn:active { background: var(--ch-sun); transform: translateY(6px); box-shadow: 0 0 0 rgba(34,51,59,0.9); }
    .aux-btn:focus-visible { outline: 3px solid var(--ch-sun); outline-offset: 2px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="ch-body">
  <div id="app"></div>

  <div id="hud">
    <div id="speedo" role="img" aria-label="Tacho">
      <svg id="speedo-svg" viewBox="0 0 120 120" aria-hidden="true">
        <g id="speedo-scale"></g>
        <g id="speedo-needle" transform="rotate(-135 60 60)">
          <polygon points="60,25 57,62 63,62" fill="var(--ch-campfire)" stroke="var(--ch-night)" stroke-width="1"></polygon>
          <circle cx="60" cy="60" r="5" fill="var(--ch-night)"></circle>
          <circle cx="60" cy="60" r="2" fill="var(--ch-cream)"></circle>
        </g>
        <text id="speedo-num" x="60" y="90" text-anchor="middle" class="speedo-num">0</text>
        <text x="60" y="101" text-anchor="middle" class="speedo-unit">km/h</text>
      </svg>
    </div>
    <div id="side" class="ch-hud">
      <div id="time">Zeit: 0.0 s</div>
      <div id="highscore">Highscore: –</div>
    </div>
  </div>

  <div id="quest"></div>
  <div id="toast"></div>

  <div id="menu">
    <canvas id="menu-ride" aria-hidden="true"></canvas>
    <img class="menu-emblem" src="images/logos/logo-hans-emblem.png" alt="Camper Hans Logo">
    <span class="menu-brand">Camper Hans</span>
    <h1 class="ch-h1 menu-title">the game</h1>
    <div id="menu-vehicles">
      <button class="veh-btn" data-veh="campervan" aria-label="Campervan"><img class="veh-img" alt="Campervan"></button>
      <button class="veh-btn" data-veh="gespann" aria-label="Grünes Auto mit Wohnwagen"><img class="veh-img" alt="Grünes Auto mit Wohnwagen"></button>
    </div>
    <div id="menu-quests"></div>
    <div id="menu-highscore">Highscore: –</div>
    <div class="menu-hint">ESC = Quest abbrechen</div>
  </div>

  <div id="success" class="hidden">
    <div class="box">
      <img class="ch-portrait result-hans" src="images/logos/logo-hans-portrait.png" alt="Camper Hans">
      <h2 class="ch-h2">Geschafft, du hast es geparkt!</h2>
      <div id="success-time"></div>
      <div id="success-highscore"></div>
      <button id="btn-to-menu" class="ch-btn ch-btn-primary ch-mt-sm">Zurück zum Hauptmenü</button>
    </div>
  </div>

  <div id="failed" class="hidden">
    <div class="box">
      <img class="ch-hans ch-hans-flip result-hans" src="images/character/hans-standing.png" alt="Hans hobelt am Camper">
      <h2 class="ch-h2">Quest gescheitert!</h2>
      <div id="fail-reason"></div>
      <div class="fail-actions">
        <button id="btn-retry" class="ch-btn ch-btn-fire">Neu starten</button>
        <button id="btn-fail-menu" class="ch-btn ch-btn-ghost">Hauptmenü</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <img class="menu-emblem" src="images/logos/logo-hans-emblem.png" alt="Camper Hans Logo">
    <div class="spinner"></div>
    <div id="loadtext">Lade Campervan …</div>
  </div>

  <div id="touch">
    <div class="cluster left">
      <button id="btn-left" aria-label="Links lenken">LINKS</button>
      <button id="btn-right" aria-label="Rechts lenken">RECHTS</button>
    </div>
    <div class="cluster right">
      <button id="btn-up" aria-label="Gas geben">GAS</button>
      <button id="btn-down" aria-label="Bremsen / Rückwärts">BREMS</button>
    </div>
  </div>

  <!-- Hupe & Ansicht: auch klickbar, Tooltip nennt die Tastenkürzel -->
  <div id="aux">
    <span class="ch-tooltip-wrap">
      <button id="btn-horn" class="aux-btn" aria-label="Hupe (Taste H)">📢 Hupe</button>
      <span class="ch-tooltip" role="tooltip">Taste H</span>
    </span>
    <span class="ch-tooltip-wrap">
      <button id="btn-view" class="aux-btn" aria-label="Ansicht wechseln (Taste C)">📷 Ansicht</button>
      <span class="ch-tooltip" role="tooltip">Taste C</span>
    </span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
